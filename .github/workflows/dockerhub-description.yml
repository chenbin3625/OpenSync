name: Docker Hub Description

on:
  push:
    branches: [main]
    paths:
      - .dockerhub/README.md
      - .github/workflows/dockerhub-description.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-description-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_REPOSITORY: chenbin3625/opensync
  DOCKERHUB_SHORT_DESCRIPTION: 飞牛 NAS / Docker 下的 AList / OpenList 自动同步工具

jobs:
  update:
    name: Update Docker Hub README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          username = os.environ.get("DOCKERHUB_USERNAME", "")
          password = os.environ.get("DOCKERHUB_TOKEN", "")
          repository = os.environ["DOCKERHUB_REPOSITORY"]
          short_description = os.environ["DOCKERHUB_SHORT_DESCRIPTION"]

          if not username or not password:
              print("Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN repository secret.", file=sys.stderr)
              sys.exit(1)

          with open(".dockerhub/README.md", "r", encoding="utf-8") as fh:
              full_description = fh.read()

          def request_json(url, method, payload=None, token=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      body = resp.read().decode("utf-8")
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  print(body, file=sys.stderr)
                  raise

          login = request_json(
              "https://hub.docker.com/v2/users/login/",
              "POST",
              {"username": username, "password": password},
          )
          token = login["token"]

          request_json(
              f"https://hub.docker.com/v2/repositories/{repository}/",
              "PATCH",
              {
                  "description": short_description,
                  "full_description": full_description,
              },
              token=token,
          )
          print(f"Updated Docker Hub description for {repository}.")
          PY
