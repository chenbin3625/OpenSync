name: Docker Hub Description

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".dockerhub/README.md"
      - ".github/workflows/dockerhub-description.yml"

permissions:
  contents: read

env:
  IMAGE_NAME: chenbin3625/opensync
  README_FILE: .dockerhub/README.md
  SHORT_DESCRIPTION: "AList/OpenList sync for fnOS NAS | 飞牛 NAS 自动同步工具"

jobs:
  update:
    name: Update Docker Hub description
    runs-on: ubuntu-latest

    steps:
      - name: Check Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Check overview file
        shell: bash
        run: |
          if [ ! -f "$README_FILE" ]; then
            echo "::error::$README_FILE not found."
            exit 1
          fi
          count="$(wc -m < "$README_FILE")"
          echo "Docker Hub overview length: $count characters"
          if [ "$count" -gt 25000 ]; then
            echo "::error::Docker Hub overview must be 25000 characters or fewer."
            exit 1
          fi

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: ${{ env.SHORT_DESCRIPTION }}
          readme-filepath: ${{ env.README_FILE }}
