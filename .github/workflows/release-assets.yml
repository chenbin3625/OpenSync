name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.10.7, optional)"
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package All Targets
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Cross-compile and package all targets
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          mkdir -p dist

          # Format: "OS/ARCH/ARM/FORMAT/BINARY_NAME"
          targets=(
            "linux/amd64//tar.gz/opensync"
            "linux/arm64//tar.gz/opensync"
            "linux/arm/7/tar.gz/opensync"
            "darwin/amd64//tar.gz/opensync"
            "darwin/arm64//tar.gz/opensync"
            "windows/amd64//zip/opensync.exe"
            "windows/arm64//zip/opensync.exe"
          )

          for target in "${targets[@]}"; do
            IFS='/' read -r os arch arm format bin_name <<< "$target"
            platform_id="${os}-${arch}${arm:+v$arm}"
            pkg_name="opensync_${version}_${platform_id}"
            pkg_dir="dist/${pkg_name}"

            echo "==> Building ${pkg_name}..."
            mkdir -p "$pkg_dir"

            GOOS="$os" GOARCH="$arch" GOARM="$arm" CGO_ENABLED=0 \
              go -C backend build -trimpath -ldflags="-s -w" -o "../${pkg_dir}/${bin_name}" ./cmd/server

            cp README.md "${pkg_dir}/README.md"

            if [ "$format" = "zip" ]; then
              (cd dist && zip -rq "${pkg_name}.zip" "${pkg_name}")
              archive="dist/${pkg_name}.zip"
            else
              tar -C dist -czf "dist/${pkg_name}.tar.gz" "${pkg_name}"
              archive="dist/${pkg_name}.tar.gz"
            fi

            (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
          done

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/*.sha256 --clobber
