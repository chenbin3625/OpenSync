title: "[Help]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this category for usage help, deployment troubleshooting, and configuration questions.

        这个分类用于使用求助、部署排障和配置问题。请尽量填写完整信息，并隐藏令牌、账号、私有路径和主机名。
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do? / 你想完成什么
      description: Describe the sync scenario or deployment goal. / 描述你的同步场景或部署目标。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境信息
      description: Version, image tag, deployment method, NAS model, CPU architecture, AList/OpenList version. / 版本、镜像标签、部署方式、NAS 型号、CPU 架构、AList/OpenList 版本。
      placeholder: |
        OpenSync:
        Deployment:
        NAS / OS:
        CPU arch:
        AList / OpenList:
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details / 详细说明
      description: Include screenshots or logs after redacting secrets. / 可附截图或日志，但请先脱敏。
    validations:
      required: false
